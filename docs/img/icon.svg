<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34">
  <!--
    The source of .claude-plugin/icon.png. One unit is one pixel at 34 px: the
    lists of the directory at claude.ai/directory drew their icons at that size
    on 2026-11-20.

    The mod's bar, bent into a C for "context". From the upper tip, against the
    clock: a baseline segment (blue), two conversation segments (orange, gold),
    then three dots of free space that close the ring. The ring has its centre
    at 18,17, an outer radius of 13 and an inner radius of 7. The two gaps are
    2 units wide and lie on whole rows and columns, so they stay sharp.
  -->
  <rect width="34" height="34" fill="#1D3160"/>
  <path d="M26.7 7.34 A13 13 0 0 0 5.04 16 L11.07 16 A7 7 0 0 1 22.68 11.8 Z" fill="#3A87FE"/>
  <path d="M5.04 18 A13 13 0 0 0 17 29.96 L17 23.93 A7 7 0 0 1 11.07 18 Z" fill="#E27117"/>
  <path d="M19 29.96 A13 13 0 0 0 26.7 26.66 L22.68 22.2 A7 7 0 0 1 19 23.93 Z" fill="#F1AE00"/>
  <circle cx="27" cy="12" r="1.75" fill="#66759A"/>
  <circle cx="28" cy="17" r="1.75" fill="#66759A"/>
  <circle cx="27" cy="22" r="1.75" fill="#66759A"/>
</svg>
